[package]
name = "polaris"
version = "0.1.0"
description = "Polaris"
authors = ["MarvelCollin"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

[features]
default = ["midtrans-production"]
midtrans-production = []

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
