name: Release

on:
  push:
    tags:
      - "v*"

env:
  DIST_REPO: MarvelCollin/Polaris-dist
  # Temporary. Copies from v2.8.0 to v2.12.0 carry a token that can only read
  # public repositories, so they cannot fetch an installer out of the private
  # dist repo. While this is "true" the same installer is also published here,
  # in public, and the legacy manifest points at that public copy instead.
  # The installer has the Turso, Midtrans and Drive credentials compiled in, so
  # set this back to "false" once those copies have migrated to v2.12.1 or later.
  PUBLIC_MIGRATION: "true"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: rust-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-release-${{ runner.os }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Write secrets
        shell: bash
        run: |
          cat > src-tauri/gdrive_secrets.toml << TOML
          midtrans_server_key = "${{ secrets.MIDTRANS_SERVER_KEY }}"
          client_id = "${{ secrets.GDRIVE_CLIENT_ID }}"
          client_secret = "${{ secrets.GDRIVE_CLIENT_SECRET }}"
          refresh_token = "${{ secrets.GDRIVE_REFRESH_TOKEN }}"
          turso_url = "${{ secrets.TURSO_URL }}"
          turso_auth_token = "${{ secrets.TURSO_AUTH_TOKEN }}"
          updater_token = "${{ secrets.UPDATER_TOKEN }}"
          TOML

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish installers to the dist repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$DIST_REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --repo "$DIST_REPO" \
            --target main \
            --title "Polaris $TAG" \
            --notes "See the assets to download this version and install." \
            src-tauri/target/release/bundle/nsis/*

      - name: Publish a public migration copy for the pre v2.12.1 endpoint
        if: env.PUBLIC_MIGRATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Polaris $TAG migration build" \
            --notes "Published so copies older than v2.12.1 can update themselves. It is withdrawn once they have. Install from the dist repository instead." \
            src-tauri/target/release/bundle/nsis/*

      - name: Publish updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          published=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          asset_url() {
            local repo="$1" token="$2" suffix="$3"
            curl -sSf -H "Authorization: Bearer ${token}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/tags/${TAG}" \
              | jq -r --arg s "$suffix" '.assets[] | select(.name | endswith($s)) | .url'
          }

          write_manifest() {
            local url="$1" out="$2"
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "installer asset not found for ${TAG}"
              exit 1
            fi
            jq -n --arg v "$version" --arg d "$published" --arg s "$signature" --arg u "$url" '{
              version: $v,
              notes: "See the release page for details.",
              pub_date: $d,
              platforms: { "windows-x86_64": { signature: $s, url: $u } }
            }' > "$out"
          }

          sig_url=$(asset_url "$DIST_REPO" "$GH_TOKEN" "x64-setup.nsis.zip.sig")
          if [ -z "$sig_url" ] || [ "$sig_url" = "null" ]; then
            echo "signature asset not found on ${TAG}"
            exit 1
          fi
          signature=$(curl -sSfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "$sig_url")

          write_manifest "$(asset_url "$DIST_REPO" "$GH_TOKEN" "x64-setup.nsis.zip")" "${RUNNER_TEMP}/latest.json"

          # The legacy manifest has to name an installer the old token can actually
          # reach. That token only reads public repositories, so while the migration
          # is on it points at the public copy rather than the private dist one.
          if [ "${PUBLIC_MIGRATION}" = "true" ]; then
            write_manifest "$(asset_url "$GITHUB_REPOSITORY" "$LEGACY_TOKEN" "x64-setup.nsis.zip")" "${RUNNER_TEMP}/legacy.json"
          else
            cp "${RUNNER_TEMP}/latest.json" "${RUNNER_TEMP}/legacy.json"
          fi

          publish_manifest() {
            local repo="$1"
            local token="$2"
            local manifest="$3"
            local dir="${RUNNER_TEMP}/manifest-$(echo "$repo" | tr '/' '-')"
            rm -rf "$dir"
            mkdir -p "$dir"
            cd "$dir"
            git init -q -b updater
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            cp "$manifest" latest.json
            git add latest.json
            git commit -q -m "chore: publish updater manifest for ${TAG}"
            git push -q --force "https://x-access-token:${token}@github.com/${repo}.git" updater:updater
            cd "${RUNNER_TEMP}"
          }

          publish_manifest "$DIST_REPO" "$GH_TOKEN" "${RUNNER_TEMP}/latest.json"
          publish_manifest "$GITHUB_REPOSITORY" "$LEGACY_TOKEN" "${RUNNER_TEMP}/legacy.json"

      - name: Verify both endpoints with the token the app carries
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
        run: node scripts/verify-updater.mjs
