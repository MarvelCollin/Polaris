name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write secrets
        shell: bash
        run: |
          cat > src-tauri/gdrive_secrets.toml << TOML
          midtrans_server_key = "${{ secrets.MIDTRANS_SERVER_KEY }}"
          client_id = "${{ secrets.GDRIVE_CLIENT_ID }}"
          client_secret = "${{ secrets.GDRIVE_CLIENT_SECRET }}"
          refresh_token = "${{ secrets.GDRIVE_REFRESH_TOKEN }}"
          turso_url = "${{ secrets.TURSO_URL }}"
          turso_auth_token = "${{ secrets.TURSO_AUTH_TOKEN }}"
          TOML

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Polaris v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
